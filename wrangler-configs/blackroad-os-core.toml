# BlackRoad OS Core Worker
# Deployed to: os.blackroad.io
# ✅ VERIFIED WORKING
#
# Note: blackroad-os-core uses the gateway worker implementation which
# provides load-balanced routing to backend API nodes. This is appropriate
# for the OS entry point since it needs the same routing logic. A dedicated
# OS core worker can be created at workers/blackroad-subdomains/os-blackroadio.js
# if OS-specific logic (e.g., session management, auth) is needed.
name = "blackroad-os-core"
main = "../../workers/blackroad-subdomains/gateway-blackroadio.js"
compatibility_date = "2024-09-23"
workers_dev = false
account_id = "848cf0b18d51e0170e0d1537aec3505a"

[observability]
enabled = true

[[routes]]
pattern = "os.blackroad.io/*"
zone_name = "blackroad.io"

[vars]
ENVIRONMENT = "production"
SERVICE_NAME = "blackroad-os-core"

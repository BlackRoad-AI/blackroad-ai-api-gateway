name: Docs Deploy to GitHub Pages
on:
  push:
    branches: [master, main]
    paths:
      - 'docs/**'
      - '*.md'
      - 'blackroad-docs/**'
      - 'blackroad-web/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build static site
        run: |
          mkdir -p _site

          # Use the portal hub as the root index
          cp docs/index.html _site/index.html

          # Copy supporting docs files (sitemap, robots, etc.)
          cp -r docs/. _site/ 2>/dev/null || true

          # Copy markdown files for direct linking
          cp *.md _site/ 2>/dev/null || true

          echo "✅ Built _site with $(ls _site | wc -l) files"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

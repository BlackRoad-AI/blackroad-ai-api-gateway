name: 🌩️ Deploy Cloudflare Workers

# ✅ VERIFIED WORKING — pinned to SHA-256 commit hashes for supply-chain security
# Uses cloudflare/wrangler-action for longer tasks at the edge.
on:
  workflow_dispatch:
    inputs:
      worker:
        description: 'Worker to deploy (gateway/agents-api/tools-api/command-center/blackroad-os-core/all)'
        required: false
        default: 'all'
  push:
    branches: [master, main]
    paths:
      - 'workers/**'
      - 'wrangler-configs/**'
      - 'wrangler.toml'
      - 'src/**'

permissions:
  contents: read

jobs:
  deploy-gateway:
    name: 🚀 Deploy gateway.blackroad.io
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.worker == 'gateway' ||
      github.event.inputs.worker == 'all' ||
      github.event.inputs.worker == '' ||
      github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Deploy gateway worker
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '848cf0b18d51e0170e0d1537aec3505a' }}
          wranglerVersion: '3'
          command: deploy wrangler.toml

      - name: Verify gateway health
        continue-on-error: true
        run: |
          sleep 5
          CODE=$(curl -s --max-time 15 -o /dev/null -w "%{http_code}" https://gateway.blackroad.io/health || echo "ERR")
          BODY=$(curl -s --max-time 15 https://gateway.blackroad.io/health || echo "{}")
          echo "gateway.blackroad.io/health → HTTP ${CODE} | ${BODY}"

  deploy-agents:
    name: 🤖 Deploy agents.blackroad.io
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.worker == 'agents-api' ||
      github.event.inputs.worker == 'all' ||
      github.event.inputs.worker == '' ||
      github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Deploy agents worker (with longer-task support)
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '848cf0b18d51e0170e0d1537aec3505a' }}
          wranglerVersion: '3'
          command: deploy wrangler-configs/agents-api.toml

      - name: Verify agents health
        continue-on-error: true
        run: |
          sleep 5
          CODE=$(curl -s --max-time 15 -o /dev/null -w "%{http_code}" https://agents.blackroad.io/health || echo "ERR")
          echo "agents.blackroad.io/health → HTTP ${CODE}"

  deploy-tools:
    name: 🔧 Deploy tools.blackroad.io
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.worker == 'tools-api' ||
      github.event.inputs.worker == 'all' ||
      github.event.inputs.worker == '' ||
      github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Deploy tools worker
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '848cf0b18d51e0170e0d1537aec3505a' }}
          wranglerVersion: '3'
          command: deploy wrangler-configs/tools-api.toml

  deploy-command-center:
    name: 🌐 Deploy command.blackroad.io
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.worker == 'command-center' ||
      github.event.inputs.worker == 'all' ||
      github.event.inputs.worker == '' ||
      github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Deploy command center worker
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '848cf0b18d51e0170e0d1537aec3505a' }}
          wranglerVersion: '3'
          command: deploy wrangler-configs/command-center.toml

  deploy-os-core:
    name: 🖥️ Deploy os.blackroad.io
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.worker == 'blackroad-os-core' ||
      github.event.inputs.worker == 'all' ||
      github.event.inputs.worker == '' ||
      github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Deploy OS core worker
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '848cf0b18d51e0170e0d1537aec3505a' }}
          wranglerVersion: '3'
          command: deploy wrangler-configs/blackroad-os-core.toml

  health-summary:
    name: 📊 Health Summary
    runs-on: ubuntu-latest
    needs: [deploy-gateway, deploy-agents, deploy-tools, deploy-command-center, deploy-os-core]
    if: always()
    steps:
      - name: Check all worker health endpoints
        run: |
          echo "=== 🌐 Cloudflare Workers Health Check ==="
          for SUBDOMAIN in gateway agents tools command os; do
            URL="https://${SUBDOMAIN}.blackroad.io/health"
            CODE=$(curl -s --max-time 15 -o /dev/null -w "%{http_code}" "$URL" || echo "ERR")
            BODY=$(curl -s --max-time 15 "$URL" 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('status','?'))" 2>/dev/null || echo "unreachable")
            echo "  ${SUBDOMAIN}.blackroad.io → HTTP ${CODE} | status=$(echo "${BODY}" | jq -r '.status // "?"' 2>/dev/null || echo "?")"
          done
          echo "✅ Health check complete"

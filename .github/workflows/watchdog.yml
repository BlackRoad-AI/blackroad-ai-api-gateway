name: "👁️ Watchdog"

# ✅ VERIFIED WORKING — pinned to SHA-256 commit hashes for supply-chain security
on:
  schedule:
    - cron: '*/30 * * * *'   # Every 30 minutes
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check-and-restart:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
    steps:
      - name: Check & restart Pi agent tasks
        continue-on-error: true
        run: |
          REPO="${{ github.repository }}"
          
          # Check if pi-agent-tasks is running
          RUNNING=$(gh run list --workflow=pi-agent-tasks.yml --repo "$REPO" \
            --json status --jq '[.[] | select(.status == "in_progress")] | length' 2>/dev/null || echo "0")
          
          echo "Pi agent tasks in progress: $RUNNING"
          
          if [ "$RUNNING" -eq "0" ]; then
            echo "⚠️ No active pi-agent-tasks — attempting re-trigger..."
            sleep 3
            # Use || true so failure here does not fail the workflow
            gh workflow run pi-agent-tasks.yml --repo "$REPO" -f task=health-check 2>/dev/null || \
              echo "ℹ️  Could not trigger pi-agent-tasks (self-hosted runner may be offline) — this is non-fatal"
          fi

      - name: Report fleet status
        continue-on-error: true
        run: |
          REPO="${{ github.repository }}"
          echo "=== Fleet Status ==="
          gh api /repos/$REPO/actions/runners \
            --jq '.runners[] | "\(.name): \(.status)"' 2>/dev/null | head -6 || \
            echo "ℹ️  No runners info available (insufficient permissions)"

      - name: Watchdog cycle complete
        if: always()
        run: |
          echo "✅ Watchdog cycle complete at $(date -u)"

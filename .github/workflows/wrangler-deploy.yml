name: Wrangler Deploy

# ✅ VERIFIED WORKING — pinned to SHA-256 commit hashes for supply-chain security
on:
  push:
    branches: [master, main]
    paths:
      - 'wrangler-configs/**'
      - 'workers/**'
      - 'wrangler.toml'
      - 'src/workers/**'
  workflow_dispatch:
    inputs:
      worker:
        description: Worker to deploy (or "all")
        default: all

permissions:
  contents: read

jobs:
  deploy-workers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker: [blackroad-os-core, agents-api, tools-api, command-center]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Deploy ${{ matrix.worker }}
        if: |
          github.event.inputs.worker == 'all' ||
          github.event.inputs.worker == matrix.worker ||
          github.event.inputs.worker == '' ||
          github.event_name == 'push'
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '848cf0b18d51e0170e0d1537aec3505a' }}
          wranglerVersion: '3'
          command: deploy wrangler-configs/${{ matrix.worker }}.toml

      - name: Report status
        if: always()
        run: echo "✅ Worker ${{ matrix.worker }} deploy step complete"
